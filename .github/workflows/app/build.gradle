plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.superapp.desi'
    compileSdk 34

    defaultConfig {
        applicationId "com.superapp.desi"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // कोर एंड्रॉइड और स्मूथ यूआई
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // रील्स (इंस्टाग्राम जैसा वर्टिकल स्वाइप)
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // यूट्यूब क्लीन प्लेयर (बिना लोगो और वॉटरमार्क वाला)
    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:core:12.1.0'

    // Firebase (डेटाबेस, वॉच पार्टी, और सीक्रेट चैट)
    implementation platform('com.google.firebase:firebase-bom:32.8.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-auth'

    // नेटवर्क और इमेज लोडिंग
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}

